name: Build Family Expense APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-apk-*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o FamilyExpense-Android-phone-build-v2.zip -d project
          cd project
          find . -maxdepth 3 -type f | head -50

      - name: Remove sensitive SMS and notification-listener access for safer sideload build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          manifests = list(Path("project").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          for path in manifests:
              tree = ET.parse(path)
              root = tree.getroot()
              for node in list(root):
                  if node.tag == 'uses-permission' and node.get(android + 'name', '').split('.')[-1] in {
                      'READ_SMS', 'RECEIVE_SMS', 'READ_PHONE_STATE', 'RECEIVE_MMS', 'READ_MMS'
                  }:
                      root.remove(node)
                  elif node.tag in {'receiver', 'service'}:
                      if 'SMS_RECEIVED' in ET.tostring(node, encoding='unicode') or 'NotificationListenerService' in ET.tostring(node, encoding='unicode'):
                          root.remove(node)
              app = root.find('application')
              if app is not None:
                  app.attrib.pop(android + 'usesCleartextTraffic', None)
              tree.write(path, encoding='utf-8', xml_declaration=True)
              result = path.read_text()
              for forbidden in ('READ_SMS', 'RECEIVE_SMS', 'NotificationListenerService', 'SMS_RECEIVED'):
                  if forbidden in result:
                      raise SystemExit(f"Sensitive entry {forbidden} remains in {path}")
              print(f"Verified reduced-permission manifest: {path}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyExpense-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
