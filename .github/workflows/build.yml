      - name: Implement SMS import and encrypted two-way Wi-Fi sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path("project/app/src/main"); j=root/"java/com/familyexpense/app"
          db=j/"ExpenseDb.java"; s=db.read_text()
          add=r"""
              public org.json.JSONArray exportForSync() {
                org.json.JSONArray a=new org.json.JSONArray();
                android.database.Cursor c=getReadableDatabase().rawQuery("SELECT description,amount,paidBy,category,participants,createdAt FROM expenses",null);
                try { while(c.moveToNext()) { org.json.JSONObject o=new org.json.JSONObject();
                  o.put("description",c.getString(0)); o.put("amount",c.getDouble(1)); o.put("paidBy",c.getString(2));
                  o.put("category",c.getString(3)); o.put("participants",c.getString(4)); o.put("createdAt",c.getLong(5)); a.put(o);
                }} catch(Exception e){throw new RuntimeException(e);} finally{c.close();} return a;
              }
              public int mergeFromSync(org.json.JSONArray a) {
                int added=0; android.database.sqlite.SQLiteDatabase d=getWritableDatabase(); d.beginTransaction();
                try { for(int i=0;i<a.length();i++){ org.json.JSONObject o=a.getJSONObject(i);
                  String desc=o.optString("description","Expense"), paid=o.optString("paidBy","Family"), cat=o.optString("category","Other");
                  double amount=o.optDouble("amount",0); long time=o.optLong("createdAt",System.currentTimeMillis()); if(amount<=0)continue;
                  android.database.Cursor c=d.rawQuery("SELECT 1 FROM expenses WHERE description=? AND amount=? AND paidBy=? AND category=? AND createdAt=? LIMIT 1",
                    new String[]{desc,Double.toString(amount),paid,cat,Long.toString(time)}); boolean exists=c.moveToFirst(); c.close(); if(exists)continue;
                  android.content.ContentValues v=new android.content.ContentValues(); v.put("description",desc); v.put("amount",amount); v.put("paidBy",paid); v.put("category",cat);
                  v.put("participants",o.optString("participants","Family")); v.put("createdAt",time); v.put("source","wifi-sync"); if(d.insert("expenses",null,v)>0)added++;
                } d.setTransactionSuccessful(); }catch(Exception e){throw new RuntimeException(e);}finally{d.endTransaction();} return added;
              }
          """
          db.write_text(s.rsplit("}",1)[0]+add+"\n}\n")
          feature=r'''package com.familyexpense.app;
          import android.Manifest; import android.app.*; import android.content.pm.PackageManager; import android.database.Cursor;
          import android.os.Build; import android.provider.Telephony; import android.text.InputType; import android.widget.*;
          import org.json.*; import java.io.*; import java.net.*; import java.security.SecureRandom; import java.util.*;
          import javax.crypto.*; import javax.crypto.spec.*;
          public final class FeatureBridge {
            interface Done { void run(); } static final int PORT=48765;
            static byte[] key(String p)throws Exception{return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(new PBEKeySpec(p.toCharArray(),"FamilyExpense-LAN-v1".getBytes("UTF-8"),150000,256)).getEncoded();}
            static byte[] crypt(byte[] b,String p,boolean enc)throws Exception{
              byte[] nonce; Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
              if(enc){nonce=new byte[12];new SecureRandom().nextBytes(nonce);c.init(1,new SecretKeySpec(key(p),"AES"),new GCMParameterSpec(128,nonce));byte[] z=c.doFinal(b),o=new byte[12+z.length];System.arraycopy(nonce,0,o,0,12);System.arraycopy(z,0,o,12,z.length);return o;}
              if(b.length<29)throw new IOException("Invalid encrypted payload");nonce=Arrays.copyOfRange(b,0,12);c.init(2,new SecretKeySpec(key(p),"AES"),new GCMParameterSpec(128,nonce));return c.doFinal(b,12,b.length-12);
            }
            static String pin(){return String.format(Locale.US,"%012d",Math.abs(new SecureRandom().nextLong()%1000000000000L));}
            static void showSync(Activity a,ExpenseDb db,TextView status,Done done){new AlertDialog.Builder(a).setTitle("Family Sync · same trusted Wi-Fi").setItems(new String[]{"Host this phone","Join another phone"},(d,w)->{if(w==0)host(a,db,status);else join(a,db,status,done);}).setNegativeButton("Cancel",null).show();}
            static void host(Activity a,ExpenseDb db,TextView status){String code=pin();new AlertDialog.Builder(a).setTitle("One-time pairing code").setMessage("Connect both phones to the same trusted Wi-Fi. Share this code privately: \n\n"+code+"\n\nKeep this screen open. Transfers are AES-GCM encrypted. Stop hosting when done.").setPositiveButton("Wait for phone",(d,w)->{status.setText("Waiting for family phone on port "+PORT);new Thread(()->{ServerSocket ss=null;try{
              ss=new ServerSocket();ss.setReuseAddress(true);ss.bind(new InetSocketAddress(PORT));ss.setSoTimeout(180000);Socket s=ss.accept();s.setSoTimeout(30000);
              DataInputStream in=new DataInputStream(s.getInputStream());DataOutputStream out=new DataOutputStream(s.getOutputStream());int n=in.readInt();if(n<29||n>10000000)throw new IOException("Invalid transfer size");byte[] b=new byte[n];in.readFully(b);
              JSONObject p=new JSONObject(new String(crypt(b,code,false),"UTF-8"));if(!"FamilyExpenseSyncV1".equals(p.optString("type")))throw new IOException("Wrong sync format");
              int got=db.mergeFromSync(p.optJSONArray("expenses")==null?new JSONArray():p.getJSONArray("expenses"));
              byte[] reply=crypt(new JSONObject().put("ok",true).put("received",got).put("expenses",db.exportForSync()).toString().getBytes("UTF-8"),code,true);out.writeInt(reply.length);out.write(reply);out.flush();s.close();
              a.runOnUiThread(()->{status.setText("Two-way sync complete");new AlertDialog.Builder(a).setTitle("Sync complete").setMessage("Received "+got+" new expenses; sent this phone's latest expense list back.").setPositiveButton("OK",null).show();});
            }catch(Exception e){a.runOnUiThread(()->new AlertDialog.Builder(a).setTitle("Sync failed").setMessage(String.valueOf(e.getMessage())).setPositiveButton("OK",null).show());}finally{try{if(ss!=null)ss.close();}catch(Exception ignored){}}}).start();}).setNegativeButton("Cancel",null).show();}
            static void join(Activity a,ExpenseDb db,TextView status,Done done){LinearLayout box=new LinearLayout(a);box.setOrientation(1);box.setPadding(32,0,32,0);EditText ip=new EditText(a);ip.setSingleLine();ip.setHint("Host phone IP address");EditText code=new EditText(a);code.setSingleLine();code.setHint("12-digit pairing code");code.setInputType(InputType.TYPE_CLASS_NUMBER);box.addView(ip);box.addView(code);
              new AlertDialog.Builder(a).setTitle("Join family sync").setMessage("Same trusted Wi-Fi required. Find the host's local IP in Wi-Fi details.").setView(box).setPositiveButton("Sync both ways",(d,w)->{String h=ip.getText().toString().trim(),p=code.getText().toString().trim();if(h.isEmpty()||p.length()!=12){new AlertDialog.Builder(a).setMessage("Enter host IP and all 12 digits.").setPositiveButton("OK",null).show();return;}status.setText("Connecting…");new Thread(()->{try{
              JSONObject payload=new JSONObject().put("type","FamilyExpenseSyncV1").put("expenses",db.exportForSync());byte[] enc=crypt(payload.toString().getBytes("UTF-8"),p,true);Socket s=new Socket();s.connect(new InetSocketAddress(h,PORT),10000);s.setSoTimeout(30000);DataOutputStream out=new DataOutputStream(s.getOutputStream());DataInputStream in=new DataInputStream(s.getInputStream());out.writeInt(enc.length);out.write(enc);out.flush();int n=in.readInt();if(n<29||n>10000000)throw new IOException("Invalid response");byte[] b=new byte[n];in.readFully(b);JSONObject r=new JSONObject(new String(crypt(b,p,false),"UTF-8"));s.close();int fromHost=db.mergeFromSync(r.optJSONArray("expenses")==null?new JSONArray():r.getJSONArray("expenses"));int toHost=r.optInt("received",0);
