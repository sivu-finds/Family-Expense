            static JSONObject parse(String sender,String body,long date){
              if(body==null||body.trim().isEmpty())return null;
              String l=body.toLowerCase(Locale.ROOT);
              // Ignore OTP/login/security codes and transactions explicitly marked failed or declined.
              if(l.contains("one time password")||l.contains("otp")||l.contains("verification code")||l.contains("cvv")||l.contains("pin is")||l.contains("transaction failed")||l.contains("txn failed")||l.contains("payment declined")||l.contains("transaction declined"))return null;
              boolean credit=l.contains("credited")||l.contains("received")||l.contains("refund")||l.contains("reversal")||l.contains("reversed")||l.contains("cashback")||l.contains("cash back")||l.contains("deposit");
              boolean transaction=credit||java.util.regex.Pattern.compile("(?i)\\b(debited|debit|withdrawn|withdrawal|spent|paid|purchase|sent|transferred|transfer|txn|transaction successful|payment successful)\\b").matcher(l).find();
              if(!transaction)return null;
              // Supports common Indian bank/UPI currency formats.
              java.util.regex.Matcher m=java.util.regex.Pattern.compile("(?i)(?:\\b(?:inr|rs\\.?|₹)\\s*([0-9,]+(?:\\.[0-9]{1,2})?)|(?:amount|amt)\\s*(?:is|of|:)?\\s*(?:inr|rs\\.?|₹)?\\s*([0-9,]+(?:\\.[0-9]{1,2})?))").matcher(body);
              if(!m.find())return null;
              String raw=m.group(1)!=null?m.group(1):m.group(2); double amount;
              try{amount=Double.parseDouble(raw.replace(",",""));}catch(Exception e){return null;}
              if(amount<=0||Double.isNaN(amount)||Double.isInfinite(amount))return null;
              String merchant=sender==null||sender.trim().isEmpty()?"Bank transaction":sender.trim();
              java.util.regex.Matcher at=java.util.regex.Pattern.compile("(?i)(?:to|at|towards|merchant(?: name)?|vpa)[:\\s]+([A-Za-z0-9][A-Za-z0-9 ._@&'-]{1,55})").matcher(body);
              if(at.find()){
                String found=at.group(1).split("(?i)\\b(?:on|ref|utr|upi|from|using|via|account|a/c|ending|available balance)\\b")[0].trim();
                found=found.replaceAll("[.,;:]+$","").trim();
                if(!found.isEmpty())merchant=found;
              }
              try{return new JSONObject().put("description",merchant).put("amount",amount).put("paidBy","Family").put("category","Other").put("participants","Family").put("createdAt",date).put("credit",credit).put("sender",sender==null?"":sender).put("preview",body);}
              catch(Exception e){return null;}
            }
            static void review(Activity a,ExpenseDb db,ArrayList<JSONObject> rows,Done done){if(rows.isEmpty()){new AlertDialog.Builder(a).setTitle("No transactions found").setMessage("No supported bank alerts found in the last 90 days.").setPositiveButton("OK",null).show();return;}String[] labels=new String[rows.size()];boolean[] checked=new boolean[rows.size()];for(int i=0;i<rows.size();i++){JSONObject o=rows.get(i);labels[i]=(o.optBoolean("credit")?"CREDIT ":"DEBIT ")+"₹"+o.optDouble("amount")+" · "+o.optString("description")+"\n"+new java.text.SimpleDateFormat("dd MMM yyyy",Locale.getDefault()).format(new Date(o.optLong("createdAt")))+" · "+o.optString("sender");}
              new AlertDialog.Builder(a).setTitle("Review; select debits to import").setMultiChoiceItems(labels,checked,(d,w,on)->checked[w]=on).setPositiveButton("Import selected",(d,w)->{int n=0;for(int i=0;i<rows.size();i++)if(checked[i]&&!rows.get(i).optBoolean("credit"))if(db.mergeFromSync(new JSONArray().put(rows.get(i)))>0)n++;final int count=n;new AlertDialog.Builder(a).setTitle("Import complete").setMessage(count+" debit expenses added. Credits were not added as expenses.").setPositiveButton("OK",(x,y)->done.run()).show();}).setNegativeButton("Cancel",null).show();}
          }'''
          (j/"FeatureBridge.java").write_text(feature)
          main=j/"MainActivity.java"; out=[]
          for line in main.read_text().splitlines():
            if "family.setOnClickListener" in line: out.append("          family.setOnClickListener(v->FeatureBridge.showSync(this,db,status,()->refresh()));")
            elif "importBtn.setOnClickListener" in line: out.append("          importBtn.setOnClickListener(v->FeatureBridge.showSmsImport(this,db,()->refresh()));")
            else: out.append(line)
          main.write_text("\n".join(out)+"\n")
          manifest=root/"AndroidManifest.xml"; android="{http://schemas.android.com/apk/res/android}"; ET.register_namespace("android","http://schemas.android.com/apk/res/android")
          tree=ET.parse(manifest); node=tree.getroot(); have={e.get(android+"name") for e in node.findall("uses-permission")}
          for name in ["android.permission.READ_SMS","android.permission.INTERNET","android.permission.ACCESS_WIFI_STATE","android.permission.ACCESS_NETWORK_STATE"]:
            if name not in have: el=ET.Element("uses-permission");el.set(android+"name",name);node.insert(0,el)
          node.find("application").set(android+"usesCleartextTraffic","false");tree.write(manifest,encoding="utf-8",xml_declaration=True)
          print("Added user-initiated SMS review and AES-GCM encrypted two-way LAN sync.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify required feature code and APK permissions
        run: |
          set -e
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          grep -q "AES/GCM/NoPadding" project/app/src/main/java/com/familyexpense/app/FeatureBridge.java
          grep -q "showSmsImport" project/app/src/main/java/com/familyexpense/app/FeatureBridge.java
          grep -q "mergeFromSync" project/app/src/main/java/com/familyexpense/app/ExpenseDb.java
          grep -q "family.setOnClickListener(v->FeatureBridge.showSync" project/app/src/main/java/com/familyexpense/app/MainActivity.java
          grep -q "importBtn.setOnClickListener(v->FeatureBridge.showSmsImport" project/app/src/main/java/com/familyexpense/app/MainActivity.java
          grep -q "onRequestPermissionsResult" project/app/src/main/java/com/familyexpense/app/MainActivity.java
          grep -q 'importBtn=button("Import SMS"' project/app/src/main/java/com/familyexpense/app/MainActivity.java
          grep -q "onRequestPermissionsResult" project/app/src/main/java/com/familyexpense/app/MainActivity.java
          grep -q 'Telephony.Sms.Inbox.CONTENT_URI' project/app/src/main/java/com/familyexpense/app/FeatureBridge.java
          grep -q 'verification code' project/app/src/main/java/com/familyexpense/app/FeatureBridge.java
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          grep -q "android.permission.READ_SMS" /tmp/apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/apk-permissions.txt
          echo "Feature source and required permissions verified in compiled APK."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyExpense-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
