name: Build Family Expense APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-apk-*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o FamilyExpense-Android-phone-build-v2.zip -d project
          cd project
          find . -maxdepth 3 -type f | head -50

      - name: Inspect current app UI source
        run: |
          echo "=== MainActivity.java ==="
          sed -n '1,260p' project/app/src/main/java/com/familyexpense/app/MainActivity.java
          echo "=== Manifest ==="
          cat project/app/src/main/AndroidManifest.xml
          echo "=== Resource files ==="
          find project/app/src/main/res -maxdepth 3 -type f -print

      - name: Inspect database and Wi-Fi sync implementations
        run: |
          echo "=== ExpenseDb.java ==="
          sed -n '1,280p' project/app/src/main/java/com/familyexpense/app/ExpenseDb.java
          echo "=== WifiSyncServer.java ==="
          sed -n '1,320p' project/app/src/main/java/com/familyexpense/app/WifiSyncServer.java
          echo "=== TransactionSmsReceiver.java ==="
          sed -n '1,240p' project/app/src/main/java/com/familyexpense/app/TransactionSmsReceiver.java

      - name: Inspect transaction capture source references
        run: |
          echo "=== Capture source files ==="
          find project -type f | grep -Ei 'TransactionSmsReceiver|TransactionNotificationListener|NotificationListener|SmsReceiver' || true
          echo "=== References ==="
          grep -RInE 'TransactionSmsReceiver|TransactionNotificationListener|NotificationListenerService|READ_SMS|RECEIVE_SMS|SMS_RECEIVED' project/app/src/main || true

      - name: Remove SMS capture for privacy-focused build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("project/app/src/main")
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          for rel in (
              "java/com/familyexpense/app/TransactionSmsReceiver.java",
              "java/com/familyexpense/app/TransactionNotificationListener.java",
              "res/xml/notification_listener_service.xml",
          ):
              path = root / rel
              if path.exists():
                  path.unlink()
                  print(f"Removed sensitive capture source/resource: {path}")
          for manifest in root.rglob("AndroidManifest.xml"):
              tree = ET.parse(manifest)
              node = tree.getroot()
              for item in list(node):
                  if item.tag == "uses-permission" and item.get(android + "name", "").split(".")[-1] in {"READ_SMS","RECEIVE_SMS","READ_PHONE_STATE","RECEIVE_MMS","READ_MMS"}:
                      node.remove(item)
              app = node.find("application")
              if app is not None:
                  for item in list(app):
                      if item.tag in {"receiver","service"}:
                          app.remove(item)
              tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Verified: SMS and notification capture removed for this build.")
          PY

      - name: Implement Family Expense dashboard UI and app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("project/app/src/main")
          java = root / "java/com/familyexpense/app/MainActivity.java"
          java.write_text(r'''package com.familyexpense.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
