name: Build Family Expense APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-apk-*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o FamilyExpense-Android-phone-build-v2.zip -d project
          cd project
          find . -maxdepth 3 -type f | head -50

      - name: Inspect transaction capture source references
        run: |
          echo "=== Capture source files ==="
          find project -type f | grep -Ei 'TransactionSmsReceiver|TransactionNotificationListener|NotificationListener|SmsReceiver' || true
          echo "=== References ==="
          grep -RInE 'TransactionSmsReceiver|TransactionNotificationListener|NotificationListenerService|READ_SMS|RECEIVE_SMS|SMS_RECEIVED' project/app/src/main || true

      - name: Remove sensitive SMS and notification-listener access for safer sideload build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          manifests = list(Path("project").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          for path in manifests:
              tree = ET.parse(path)
              root = tree.getroot()
              for node in list(root):
                  if node.tag == 'uses-permission' and node.get(android + 'name', '').split('.')[-1] in {
                      'READ_SMS', 'RECEIVE_SMS', 'READ_PHONE_STATE', 'RECEIVE_MMS', 'READ_MMS'
                  }:
                      root.remove(node)
                  elif node.tag in {'receiver', 'service'}:
                      # This project only uses these components for SMS/notification transaction capture.
                      root.remove(node)
              app = root.find('application')
              if app is not None:
                  app.attrib.pop(android + 'usesCleartextTraffic', None)
              tree.write(path, encoding='utf-8', xml_declaration=True)
              result = path.read_text()
              for forbidden in ('READ_SMS', 'RECEIVE_SMS', 'READ_PHONE_STATE', 'RECEIVE_MMS', 'READ_MMS'):
                  if forbidden in result:
                      raise SystemExit(f"Sensitive entry {forbidden} remains in {path}")
              print(f"Verified reduced-permission manifest: {path}")
          PY

      - name: Remove SMS and notification capture code from compiled app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("project/app/src/main")
          # Remove the two source components that read transaction SMS or notifications.
          for rel in (
              "java/com/familyexpense/app/TransactionSmsReceiver.java",
              "java/com/familyexpense/app/TransactionNotificationListener.java",
              "res/xml/notification_listener_service.xml",
          ):
              path = root / rel
              if path.exists():
                  path.unlink()
                  print(f"Removed sensitive capture source/resource: {path}")
          # Remove the runtime request for SMS permissions from MainActivity.
          activity = root / "java/com/familyexpense/app/MainActivity.java"
          source = activity.read_text()
          lines = source.splitlines(keepends=True)
          filtered = [line for line in lines if "Manifest.permission.READ_SMS" not in line and "Manifest.permission.RECEIVE_SMS" not in line]
          activity.write_text("".join(filtered))
          # Fail closed if sensitive permission requests or capture class references remain.
          scan = "\\n".join(p.read_text(errors="ignore") for p in root.rglob("*.java"))
          forbidden = ("Manifest.permission.READ_SMS", "Manifest.permission.RECEIVE_SMS", "TransactionSmsReceiver", "TransactionNotificationListener", "NotificationListenerService", "SMS_RECEIVED")
          remaining = [item for item in forbidden if item in scan]
          if remaining:
              raise SystemExit("Sensitive capture code remains in Java sources: " + ", ".join(remaining))
          print("Verified: SMS and notification capture source code removed")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyExpense-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
