name: Build Family Expense APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-apk-*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o FamilyExpense-Android-phone-build-v2.zip -d project
          cd project
          find . -maxdepth 3 -type f | head -50

      - name: Remove sensitive SMS and notification-listener access for safer sideload build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifests = list(Path("project").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          for path in manifests:
              text = path.read_text()
              text = re.sub(r'^.*android\\.permission\\.(READ_SMS|RECEIVE_SMS|READ_PHONE_STATE|RECEIVE_MMS|READ_MMS|SMS_RECEIVED).*\\n', '', text, flags=re.MULTILINE)
              # Disable notification-listener services that can read transaction notifications.
              text = re.sub(r'^[ \\t]*<service\\b(?:(?!</service>).)*NotificationListenerService(?:(?!</service>).)*</service>\\s*', '', text, flags=re.MULTILINE | re.DOTALL)
              path.write_text(text)
              print(f"Reduced sensitive permissions in {path}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyExpense-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
