            static void showSmsImport(Activity a,ExpenseDb db,Done done){if(Build.VERSION.SDK_INT>=23&&a.checkSelfPermission(Manifest.permission.READ_SMS)!=PackageManager.PERMISSION_GRANTED){new AlertDialog.Builder(a).setTitle("Allow SMS scanning").setMessage("Family Expense scans inbox messages from the last 90 days only after you choose Import SMS. Transaction detection happens on this phone. You review detected transactions before saving; SMS import does not upload message text.").setNegativeButton("Cancel",null).setPositiveButton("Allow",(d,w)->a.requestPermissions(new String[]{Manifest.permission.READ_SMS},602)).show();return;}
